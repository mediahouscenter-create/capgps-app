workflows:
  ios-app-store:
    name: iOS App Store Release (CAP GPS Traker)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_api_key # Name of the API key set in Codemagic Team Settings -> Integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.trackcapgps.app
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.trackcapgps.app"
        APP_STORE_APPLE_ID: 6831236708
    scripts:
      - name: Disable Swift Package Manager (Force CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS IPA Package
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" -le 4 ] 2>/dev/null; then
            NEW_BUILD_NUMBER=5
          else
            NEW_BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          fi
          echo "Building iOS package with build number: $NEW_BUILD_NUMBER"
          cd ios && agvtool new-version -all $NEW_BUILD_NUMBER && cd ..
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
